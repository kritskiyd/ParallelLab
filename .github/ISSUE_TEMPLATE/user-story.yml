name: Пользовательская история
description: Функция продукта с требованиями и критериями приёмки
labels: [история]
body:
  - type: textarea
    id: story
    attributes:
      label: Пользовательская история
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Описание
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Функциональные требования
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Входные данные
    validations:
      required: true
  - type: textarea
    id: outputs
    attributes:
      label: Выходные данные
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Основной сценарий использования
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативные сценарии
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Возможные ошибки
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
    validations:
      required: true
  - type: textarea
    id: nonfunctional
    attributes:
      label: Нефункциональные требования
    validations:
      required: false
  - type: textarea
    id: questions
    attributes:
      label: Вопросы для уточнения
    validations:
      required: false
  - type: textarea
    id: epic
    attributes:
      label: Родительский раздел
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Зависимости
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Связь с картой пользовательских историй
    validations:
      required: true
  - type: textarea
    id: sprint
    attributes:
      label: Спринт
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      options: ["Высокий (P0)", "Средний (P1)", "Низкий (P2)"]
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Выпуск
      options: ["Первый выпуск (MVP)", "Второй выпуск", "Третий выпуск"]
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Оценка сложности
      options: ["1", "2", "3", "5", "8", "13"]
    validations:
      required: true
  - type: markdown
    attributes:
      value: После создания задачи укажите родительский раздел и заполните поля проекта «Спринт», «Выпуск», «Приоритет» и «Оценка сложности». Значения из формы не переносятся в эти поля автоматически.
