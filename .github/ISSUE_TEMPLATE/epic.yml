name: Функциональный раздел
description: Крупное направление и дочерние пользовательские истории
labels: [раздел]
body:
  - type: textarea
    id: description
    attributes:
      label: Описание и бизнес-ценность
      description: Какую потребность покрывает направление и для кого
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Функциональный охват и границы выпусков
      description: Первый, второй и третий выпуски без переноса CUDA Native в первый
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Критерии завершения
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Дочерние пользовательские истории
      description: Ссылки на реальные задачи; после создания настройте нативные дочерние связи
