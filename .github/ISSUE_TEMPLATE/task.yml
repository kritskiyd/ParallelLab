name: Техническая задача
description: Техническая часть одной пользовательской истории
labels: [задача]
body:
  - type: input
    id: parent
    attributes:
      label: Родительская история
      description: Ссылка на пользовательскую историю; после создания добавьте задачу к её подзадачам
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Техническая задача
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Результат и способ проверки
    validations:
      required: true
  - type: markdown
    attributes:
      value: Оценка относится к родительской истории. Не дублируйте её в технических частях и не закрывайте историю после выполнения одной задачи.
